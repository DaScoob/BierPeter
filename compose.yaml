services:
  bierpeter:
    build: .
    container_name: pompui-bierpeter-alpha
    ports:
      - "${BIERPETER_BIND:-0.0.0.0}:6017:8080"
    volumes:
      - bierpeter-data:/data
    environment:
      BIERPETER_SECURE_COOKIE: "${BIERPETER_SECURE_COOKIE:-0}"
      BIERPETER_ADMIN_KEY: "${BIERPETER_ADMIN_KEY:-}"
      DEVICE_API_KEY: "${DEVICE_API_KEY:-}"
      BIERPETER_PUBLIC_URL: "${BIERPETER_PUBLIC_URL:-}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
volumes:
  bierpeter-data:
